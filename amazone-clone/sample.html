
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Navbar Clone</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #e3e6e6;
}

/* MAIN HEADER */
.header {
    width: 100%;
    background: #131921;
    color: white;
    display: flex;
    align-items: center;
    padding: 5px 10px;
    gap: 12px;
    min-height: 40px;
}

/* LOGO */
.logo {
    font-size: 22px;
    font-weight: bold;
    color: white;
    white-space: nowrap;
}

.logo span {
    color: #ff9900;
}

/* ADDRESS */
.location {
    font-size: 11px;
    min-width: 105px;
    cursor: pointer;
}

.location p {
    color: #ccc;
    margin-left: 17px;
}

.location strong {
    font-size: 12px;
}

/* SEARCH BAR */
.search {
    display: flex;
    flex: 1;
    height: 35px;
    border-radius: 5px;
    overflow: hidden;
}

.search select {
    width: 55px;
    border: none;
    background: #e6e6e6;
    padding: 5px;
    font-size: 11px;
}

.search input {
    flex: 1;
    border: none;
    outline: none;
    padding: 8px;
    font-size: 14px;
}

.search button {
    width: 38px;
    border: none;
    background: #febd69;
    font-size: 20px;
    cursor: pointer;
}

/* LANGUAGE */
.language {
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
}

/* ACCOUNT */
.account, .orders {
    font-size: 11px;
    white-space: nowrap;
    cursor: pointer;
}

.account strong,
.orders strong {
    font-size: 12px;
}

/* CART */
.cart {
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
}

/* NAVIGATION BAR */
.navbar {
    background: #232f3e;
    color: white;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 7px 12px;
    font-size: 12px;
    min-height: 28px;
    overflow: hidden;
}

.navbar div {
    white-space: nowrap;
    cursor: pointer;
}

.navbar div:hover {
    border: 1px solid white;
    padding: 4px;
}

.all {
    font-size: 14px;
    font-weight: bold;
}

/* PRIME DAY */
.prime {
    margin-left: auto;
    color: white;
    font-size: 19px;
    font-weight: bold;
    white-space: nowrap;
}

.prime span {
    color: #00a8e0;
}

.prime small {
    display: block;
    font-size: 9px;
    text-align: right;
}

/* RESPONSIVE */
@media(max-width: 750px) {
    .header {
        gap: 7px;
        flex-wrap: wrap;
    }

    .location, .orders {
        display: none;
    }

    .search {
        order: 5;
        flex-basis: 100%;
    }

    .navbar {
        gap: 12px;
        overflow-x: auto;
    }

    .prime {
        display: none;
    }
}

@media(max-width: 400px) {
    .account {
        font-size: 9px;
    }

    .language {
        font-size: 11px;
    }

    .logo {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

    <div class="logo">
        <img src="logo.png" alt="">
    </div>

    <div class="location">
        <p>Hello</p>
        <strong>📍 Select your address</strong>
    </div>

    <div class="search">
        <select>
            <option>All</option>
            <option>Electronics</option>
            <option>Fashion</option>
            <option>Books</option>
        </select>

        <input type="text" placeholder="Search Amazon.in">

        <button>⌕</button>
    </div>

    <div class="language">
        🇮🇳 EN ▾
    </div>

    <div class="account">
        <span>Hello, Sign in</span>
        <br>
        <strong>Account & Lists ▾</strong>
    </div>

    <div class="orders">
        <span>Returns</span>
        <br>
        <strong>& Orders</strong>
    </div>

    <div class="cart">
        🛒 Cart
    </div>

</header>

<!-- NAVIGATION -->
<nav class="navbar">

    <div class="all">☰ All</div>
    <div>Best Sellers</div>
    <div>Mobiles</div>
    <div>Customer Service</div>
    <div>Today's Deals</div>
    <div>Fashion</div>
    <div>Electronics</div>
    <div>Books</div>
    <div>Prime ▾</div>
    <div>New Releases</div>
    <div>Home & Kitchen</div>
    <div>Amazon Pay</div>

    <div class="prime">
        <span>prime</span> day
        <small>23rd - 24th July</small>
    </div>

</nav>

</body>
</html>
